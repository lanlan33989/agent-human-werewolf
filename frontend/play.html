<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5B21B6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>面杀高手 · 对局</title>
<!--
  真引擎驱动的对局页。

  与 demo/index.html 的关系：
    · 界面形式**以 demo/index.html 为绝对参照** —— 样式表 table.css 和
      排座/座位特效 table.js 都是从它**原样提取**的，页面结构也用同一套 id
      （p0 封面 / p3 身份牌 / p4 牌桌），保证两边长得一模一样。
    · demo/index.html 本身**一个字符都没有改动** —— 它是纯前端演示，留着给人看。
    · 区别只有一个：这一页的数据来自真引擎（/api/game/*），不是前端编的剧本。

  为什么不做成单文件双击打开：数据必须来自引擎，而引擎在服务端。
  起服务后打开 http://localhost:8000/play 即可（手机同局域网也能开）。
-->
<link rel="stylesheet" href="/table.css">
<style>
  /* 只加 demo 里没有的两块：轮盘、发言记录。其余全部走 table.css。 */
  /* ===== 2026-10-05 大改版：黑色半透明交接卡片全部取消 =====
     #handoff 现在只是：① 一个纯状态标记（.on = 有人拿着手机）；
     ② 底部一条透明操作条（打字兜底 / 提示 / 报错），没有卡片底、没有幕布。 */
  #handoff{
    position:absolute;inset:0;z-index:9;display:none;
    background:transparent;pointer-events:none;
    flex-direction:column;justify-content:flex-end;
  }
  #handoff.on{display:flex;}
  #handoff .sheet{
    pointer-events:none;display:flex;flex-direction:column;
    margin:0 10px calc(env(safe-area-inset-bottom,0px) + 2px);
    padding:0;background:transparent;box-shadow:none;max-height:none;overflow:visible;
  }
  #handoff .sheet > *{pointer-events:auto;}
  #handoff .tip{margin-top:6px;font-size:13px;color:rgba(255,255,255,.75);text-align:center;
    text-shadow:0 1px 4px rgba(0,0,0,.7);}
  #handoff #hoSpeak{display:none;flex-direction:column;gap:8px;margin-top:6px;}
  #handoff #hoSpeak.on{display:flex;}
  #handoff .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  #handoff .row button{
    min-width:74px;padding:14px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.28);
    background:rgba(0,0,0,.45);color:#fff;font-family:inherit;font-size:18px;font-weight:700;
  }
  #handoff .row button.sel{background:var(--yellow);color:var(--purple-d);border-color:var(--yellow);}
  #handoff .row button[disabled]{opacity:.4;}
  #handoff input{
    width:100%;padding:14px;border-radius:12px;font-family:inherit;font-size:16px;
    border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.45);color:#fff;
  }
  /* ===== 轮盘（大圆 = 唯一按钮区域）===== */
  #wheelRot{
    position:absolute;inset:0;border-radius:50%;
    transform:rotate(0deg);will-change:transform;
  }
  /* 号码刻度：按人数均分圆周，JS 算好角度后用 left/top 定位 */
  .wnum{
    position:absolute;width:46px;height:46px;border-radius:50%;
    transform:translate(-50%,-50%);
    border:2.5px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.10);color:#fff;
    font-family:inherit;font-size:19px;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .wnum.human{border-color:#4da3ff;}
  .wnum.ai{border-color:#ff5252;}
  .wnum.dead{opacity:.3;}
  /* ★ 2026-10-29（用户：当前发言玩家高亮 = **玩家序号所在的小圆圈**）：
     手机上真正看得见的就是轮盘这一圈号码（.seat 在 #p4 是 display:none，
     大圆里的文字又每句都在变）。所以高亮落在这里：金环 + 呼吸光晕 + 号码提亮，
     一眼能看出"现在是谁在说"。 */
  .wnum.speaking{
    border-color:var(--yellow);
    background:rgba(255,213,61,.30);
    color:#FFF7D0;text-shadow:0 0 10px rgba(255,213,61,.9);
    box-shadow:0 0 0 4px rgba(255,213,61,.40), 0 0 20px rgba(255,213,61,.80);
    animation:numGlow 1.4s ease-in-out infinite;
    z-index:3;
  }
  /* 出局者留遗言时他的号码已经 .dead（opacity .3）—— 正在说话就抬回来 */
  .wnum.dead.speaking{opacity:.9;}
  @keyframes numGlow{
    0%,100%{box-shadow:0 0 0 3px rgba(255,213,61,.30), 0 0 12px rgba(255,213,61,.55)}
    50%{box-shadow:0 0 0 8px rgba(255,213,61,.50), 0 0 26px rgba(255,213,61,.95)}
  }
  .wnum.pick{cursor:pointer;animation:pickBreathe 1.5s ease-in-out infinite;}
  .wnum.sel{background:var(--yellow);color:var(--purple-d);border-color:var(--yellow);}
  .wnum.victim{border-color:#ff5a5a;background:rgba(255,90,90,.3);color:#ffd9d9;}
  /* 刻度上的私有标记（队友/验人/狼刀指向）—— 随轮盘一起转 */
  .wnum .tag{
    position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    font-size:11px;font-weight:700;font-style:normal;white-space:nowrap;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none;
  }
  .wnum .tag.wolfmate{color:#ff9b9b;}
  .wnum .tag.seerwolf{color:#ff7b7b;}
  .wnum .tag.seergood{color:#9fd0ff;}
  .wnum .tag.knife{color:#ffd53d;}
  /* 圆心按钮（点圆心 = 确认/开始/交回）—— 大圆本体的点击语义由 JS 状态机决定 */
  #p4 .tcenter{touch-action:none;}   /* 拖盘旋转必须掐掉浏览器滚动手势 */
  #p4 .tcenter.acting{border-color:var(--yellow);
    box-shadow:0 0 0 6px rgba(255,213,61,.18);cursor:pointer;}
  #p4 .tcenter .who{white-space:normal;}
  /* 倒计时数字（2026-10-06 用户定：神职 15s / 狼刀 20s，服务端裁决） */
  #cdNum{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    font-size:30px;font-weight:800;color:var(--yellow);line-height:1;
    font-variant-numeric:tabular-nums;}
  #cdNum.urgent{color:#ff5a5a;animation:cdBlink 1s steps(2) infinite;}
  @keyframes cdBlink{50%{opacity:.35;}}
  /* 预言家结果的大标识（2026-10-07 第二期用户定稿）：播报「他是这个」时
     圆盘上显示大大的好（绿）/坏（红），3 秒后消失（与「预言家请闭眼」同时）。
     只有本人看得到 —— AI 预言家/没验人时它根本不出现。 */
  #seerBig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:none;z-index:8;pointer-events:none;
    font-size:132px;font-weight:900;line-height:1;
    text-shadow:0 6px 22px rgba(0,0,0,.75);}
  #seerBig.on{display:block;}
  #seerBig.good{color:#5ac878;}
  #seerBig.bad{color:#ff5a5a;}
  /* 女巫的 ✓ / ✕：两个都大（用户点名） */
  #wheelBtns{position:absolute;left:0;right:0;bottom:-64px;display:none;
    justify-content:center;gap:26px;z-index:10;}
  #wheelBtns.on{display:flex;}
  #wheelBtns button{
    width:76px;height:76px;border-radius:50%;font-size:38px;line-height:1;
    font-family:inherit;font-weight:800;border:3px solid;
    cursor:pointer;padding:0;
  }
  #wheelYes{background:rgba(90,200,120,.18);border-color:#5ac878;color:#8be38b;}
  #wheelNo{background:rgba(255,90,90,.14);border-color:#ff5a5a;color:#ff9b9b;}
  /* 空刀时解药按钮**置灰不可点**（2026-10-07 用户定：照常走解药播报与面板流程，
     只是解药按钮置灰）。pointer-events 也关掉 —— 免得长按/触摸还留一条缝。 */
  #wheelYes.off, #wheelYes:disabled{
    background:rgba(255,255,255,.06);border-color:#5b6472;color:#7b8593;
    opacity:.6;filter:grayscale(1);pointer-events:none;}
  /* 轮盘下方的补充入口（空刀 / 都不用 / 交回） */
  #wheelExtra{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(14px + 44px + 58px);display:none;gap:10px;justify-content:center;
    z-index:6;width:max-content;max-width:96%;}
  #wheelExtra.on{display:flex;}
  #wheelExtra button{
    min-width:86px;padding:12px 14px;border-radius:999px;font-size:15px;font-weight:700;
    border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);
    color:#fff;font-family:inherit;
  }
  /* 播报进度条跟着顶栏一起删了； speakQueue 里的 progBar 引用已去掉 */
  #logbox{
    flex:0 0 auto;max-height:26vh;overflow-y:auto;
    margin-top:8px;padding:10px 12px;border-radius:14px;
    background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);
    font-size:13px;line-height:1.6;color:rgba(255,255,255,.82);
  }
  #logbox .sys{color:rgba(255,213,61,.92);}
  #logbox .say{margin-top:2px;}
  #health{font-size:12px;line-height:1.7;color:rgba(255,255,255,.72);text-align:center;margin-top:10px;}
  #health .bad{color:#FFB4B4;}
  #health .ok{color:#B7F0B1;}
  /* 人数输入 —— 替代原来的「选一个板子」（2026-09-15 改） */
  .counters{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:10px;}
  .counters label{font-size:15px;color:rgba(255,255,255,.82);}
  .counters input{
    width:66px;margin-left:6px;padding:8px;border-radius:10px;text-align:center;
    border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.1);
    color:#fff;font-family:inherit;font-size:18px;
  }
  #rulesLine{font-size:13px;line-height:1.7;color:rgba(255,255,255,.72);text-align:center;margin-top:12px;}
  #rulesLine .bad{color:#FFB4B4;}
  /* 档位选择：四个并排按钮 + 一行说明 */
  .levels{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
  .levels button{
    flex:1 1 0;min-width:70px;padding:10px 6px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.82);font-family:inherit;font-size:15px;
  }
  .levels button.on{background:#E5484D;border-color:#E5484D;color:#fff;font-weight:700;}
  .leveldesc{font-size:12px;line-height:1.6;color:rgba(255,255,255,.6);text-align:center;margin-top:8px;min-height:32px;}
  /* 合规提醒横幅（连续使用超 2 小时） */
  .longuse{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;
           background:rgba(255,213,61,.12);border:1px solid rgba(255,213,61,.4);
           color:#FFE08A;font-size:12.5px;line-height:1.6;text-align:left;}
  .longuse.on{display:block;}
  /* 规则开关：一行一项，勾选框/下拉靠左 */
  .switches{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .sw{display:flex;align-items:center;gap:8px;font-size:13.5px;color:rgba(255,255,255,.86);}
  .sw input[type=checkbox]{width:18px;height:18px;accent-color:#E5484D;}
  .sw select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.24);
             border-radius:8px;padding:4px 8px;font-family:inherit;font-size:13px;}
  /* 局末出口：战报与榜单（局中隐藏） */
  .endlinks{display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .endlinks a{text-decoration:none;}
  /* 现场诊断面板（手机排查用）—— **固定浮层**，任何页面都能打开。
     为什么必须是浮层：它原来挂在牌桌页里，而"连一局都开不起来"的时候根本进不了牌桌页 ——
     最需要诊断的时刻恰恰看不到它（用户 2026-09-19 就是这么反馈的）。
     手机上也没有控制台，用户能说的只有"没反应"，而"没反应"至少有五种原因
     （不是安全上下文 / 没给麦克风接口 / 约束被拒 / 音频没解锁 / 识别通道不通），
     所以这些必须逐条摆到屏幕上，而不是让人去猜。 */
  .diagpanel{display:none;position:fixed;z-index:80;
             left:50%;transform:translateX(-50%);
             width:min(410px, calc(100vw - 20px));
             bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
             max-height:72vh;overflow-y:auto;
             padding:12px;border-radius:14px;
             background:rgba(8,2,18,.97);border:1px solid rgba(255,255,255,.22);
             box-shadow:0 10px 30px rgba(0,0,0,.6);
             color:rgba(255,255,255,.86);font-size:12px;line-height:1.7;
             text-align:left;word-break:break-all;
             font-family:ui-monospace,Consolas,monospace;}
  .diagpanel.on{display:block;}
  .diagpanel .k{color:#FFD53D;}
  .diagpanel .bad{color:#FFB4B4;}
  .diagpanel .ok{color:#8BE38B;}
  /* 诊断悬浮按钮：固定在最上层（z-index 高于交接浮层的 9），
     手机上任何时候都点得到。半透明、小，尽量不碍事。 */
  .diagfab{position:fixed;z-index:90;padding:0;
           top:calc(env(safe-area-inset-top,0px) + 6px);
           right:calc(50% - min(215px, 50vw) + 6px);
           width:34px;height:34px;border-radius:50%;font-size:15px;line-height:1;
           background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.28);
           color:#FFD53D;opacity:.6;font-family:inherit;}
  .diagfab:active{opacity:1;}
  /* 录音按钮（原「按住说话」）。
     ⚠️ 2026-09-29 起交互是**点一下开始、再点一下结束**，而且按钮里**不放文字**：
        · 有文字时手机上长按会弹浏览器自带的"复制"菜单 ⇒ 去掉文字节点（外观用 ::before 画）。
        · "按住"那一套手势问题（手指移动被判成滚动 ⇒ pointercancel ⇒ 秒松开）随之消失；
          但 `touch-action:none` **继续保留** —— 对"点按"它同样是对的：
          避免手指在按钮上小幅移动被当成滚动，把这一下点击吞掉。
        · 状态不再写在按钮文字上：`.on` = 正在录音（话筒圆点 → 红方块）。 */
  #hoSay{touch-action:none;-webkit-touch-callout:none;user-select:none;
         display:inline-flex;align-items:center;justify-content:center;
         min-width:104px;}
  #hoSay::before{content:"";width:16px;height:16px;border-radius:50%;
                 background:currentColor;opacity:.9;}
  #hoSay.on::before{border-radius:4px;background:#ff5a5a;opacity:1;}
  #hoSay.on{box-shadow:0 0 0 2px rgba(255,90,90,.5) inset;}
  /* 浮层里的其它按钮：别让双击缩放/滚动把它们的手势吃掉。
     🔴 **必须排除 #hoSay**（2026-09-21 修）。原因是一条很隐蔽的特异性压制：
       这一条的特异性是 0,1,1,1（#handoff .sheet button），而上面 152 行的
       `#hoSay{touch-action:none}` 是 0,1,0,0 —— **无论谁写在后面都输**，
       于是"按住说话声明 touch-action:none"那个修复一直是**死代码**：
       手机上长按照样被浏览器判成滚动手势 ⇒ pointercancel ⇒ 秒自己松开，
       正是 §9.3 记的那个用户报障。修法是让这条批量规则**不匹配它**，
       而不是把 152 行挪到后面（同样是 0,1,0,0，挪了也没用）。
       抓到它的是 `_smoke-play.js` 里那条 touch-action 断言 ——
       在此之前它从没在"交接屏开着"的状态下跑过，所以一直没露出来。 */
  #handoff .sheet button{touch-action:manipulation;}
  /* 座次编排（2026-10-01）：开局前拖动决定人类/AI 的座位顺序 */
.planChip { display:inline-block; padding:5px 8px; border-radius:8px; font-size:12px;
            border:1px solid #c9c2b8; background:#fff; cursor:grab; user-select:none; }
.planChip.ph { background:#3b2a86; color:#fff; border-color:#3b2a86; }
.planChip.pa { color:#333; }
.planChip.sel { outline:3px solid #e8a33d; }
.planChip.drag { opacity:.4; }
/* ===== 单个大圆（2026-10-02 用户定，只改本页，demo 不动）=====
   ① 不再一圈座位：谁在说话，大圆就显示谁（N号玩家（AI）/（人类）/法官）。
   ② AI 文本不上屏，只有票型用大字展示。
   ③ 人类发言回合：大圆显示「N号玩家（人类）」，点一下开始、再点一下结束，
      并且**不再弹半透明交接卡片**（.sheet）。 */
#p4 .seat, #p4 .wound{display:none;}
#p4 .tcenter{ width:min(58vw,300px); height:min(58vw,300px); }
#p4 .tcenter .g{ font-size:calc(min(58vw,300px) * .2); }
#p4 .tcenter .t{ font-size:calc(min(58vw,300px) * .1); letter-spacing:1px; }
#p4 .tcenter .who{ font-size:calc(min(58vw,300px) * .14); font-weight:800;
  color:#fff; margin-top:8px; text-align:center; line-height:1.35; padding:0 10px;
  white-space:nowrap; }
/* ★ 2026-10-29（用户：AI 发言时大圆要写「×号正在发言中」）：
   原来那句 .who 是 14% ≈ 35px 且 nowrap，七个字直接顶穿圆盘、压在号码上；
   同时上面还挂着「法官」两个字 —— 说话的明明是 2 号。发言态一律：
   藏掉"法官"标题，字号降到 10.5%，长号码也放得下。 */
#p4 .tcenter.talking .t{ display:none; }
#p4 .tcenter.talking .g{ font-size:calc(min(58vw,300px) * .16); margin-bottom:2px; }
#p4 .tcenter.talking .who{ font-size:calc(min(58vw,300px) * .105); margin-top:2px;
  padding:0 6px; letter-spacing:1px; color:#FFF7D0;
  text-shadow:0 0 14px rgba(255,213,61,.55); }
#p4 .tcenter.pickable{ cursor:pointer;
  border-color:var(--yellow);
  animation:pickBreathe 1.5s ease-in-out infinite; }
#p4 .tcenter.rec{ border-color:#ff5a5a;
  box-shadow:0 0 0 8px rgba(255,90,90,.25); }
/* 票型框（2026-10-28 用户定；2026-10-31 恢复法官播报票型后仍保留）：
   法官用嘴念票型（"3 号 2 票（1 号、4 号投的）…"），底部窄条同步显示紧凑票型，
   首轮/加时轮分别显示（加时结算后再换成加时那一轮）。
   · 宽度约竖屏的 15%（锚在 #phone 上，所以 15% 就是手机宽度的 15%）
   · 内容多时**可上下滚动**（overflow-y:auto + 触摸惯性）
   · 每行一条："2，3→5"（2 号、3 号投给 5 号）；弃票单列一行 */
#voteBox{ position:absolute; left:8px; bottom:16px; width:15%; min-width:52px; max-width:104px;
  max-height:38%; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  background:rgba(8,4,20,.72); border:1px solid rgba(255,224,138,.45); border-radius:10px;
  padding:5px 3px; z-index:9; display:none; touch-action:pan-y;
  box-shadow:0 2px 12px rgba(0,0,0,.45); }
/* 新票型落定的一次性高亮（3 秒）——手机上这块地方很小，不闪一下很容易被忽略 */
#voteBox.vb-pop{ animation:vbPop 1.1s ease-out 2; }
@keyframes vbPop{
  0%{ box-shadow:0 0 0 0 rgba(255,224,138,.85); }
  100%{ box-shadow:0 0 0 10px rgba(255,224,138,0); }
}
#voteBox .vb-t{ font-size:10px; line-height:1.3; color:rgba(255,224,138,.8);
  text-align:center; margin-bottom:2px; letter-spacing:1px; }
#voteBox .vb-l{ font-size:13px; font-weight:800; color:#FFE08A; text-align:center;
  line-height:1.5; word-break:break-all; text-shadow:0 1px 6px rgba(0,0,0,.75); }
/* 终局弹框（2026-10-28 用户定）：法官念完「游戏结束，狼人/好人胜利」之后再弹。
   它只盖住手机框内部（#phone 是定位容器），不影响右上角的 ⏭ / ↻。 */
#endPop{ position:absolute; left:0; right:0; top:0; bottom:0; z-index:40; display:none;
  align-items:center; justify-content:center; background:rgba(0,0,0,.55); padding:26px; }
#endPop.on{ display:flex; }
#endPop .eb{ width:100%; max-width:330px; background:#1b1530;
  border:1px solid rgba(255,224,138,.45); border-radius:18px; padding:26px 20px 20px;
  text-align:center; box-shadow:0 18px 48px rgba(0,0,0,.65); }
#endPop .eb-who{ font-size:30px; font-weight:800; color:#FFE08A; letter-spacing:2px; }
#endPop .eb-sub{ margin-top:10px; font-size:13px; color:rgba(255,255,255,.68); line-height:1.6; }
#endPop .eb-btn{ margin-top:18px; width:100%; padding:12px 0; border-radius:12px;
  font-size:16px; font-weight:700; border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10); color:#fff; font-family:inherit; }
/* 大圆发言模式下的提示行与按钮（2026-10-02）：
   提示行 = 录音状态唯一可见处（● 红 = 正在录音）；按钮 = 过 / 打字 */
#spkTip{ position:absolute; left:50%; bottom:calc(14px + 44px + 54px); transform:translateX(-50%);
  max-width:94%; text-align:center; font-size:14px; font-weight:600;
  color:rgba(255,255,255,.88); text-shadow:0 1px 6px rgba(0,0,0,.65);
  z-index:5; display:none; line-height:1.5; }
#spkTip.rec{ color:#FF9B9B; }
#sayCtl{ position:absolute; left:50%; bottom:calc(14px + 44px); transform:translateX(-50%);
  z-index:5; display:none; }
#sayCtl.on{ display:block; }
#sayCtl button{ min-width:96px; padding:13px 18px; border-radius:14px; font-size:17px;
  font-weight:700; border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.35); color:#fff; font-family:inherit; }
/* 大圆发言模式复用 startSay/stopSay：它们要 #hoSay/#hoText/#hoStatus 存在，
   这里给一套视觉上隐藏的（display:none 会连事件一起藏 —— 无妨，点击走大圆） */
#spkHolder{ display:none; }
/* ===== 座位小圆（2026-10-02 用户追加）=====
   大圆顶部一排小圆代表玩家：圆内只有号码，人类蓝轮廓、AI 红轮廓；
   轮到谁行动，光标（黄色小三角）就滑到谁头上 —— 位置用 transition 平滑过去，
   而不是瞬移，这样"轮转"看得见。一行至多 8 个（超出自动换行）。 */
#seatDots{ position:absolute; left:50%; top:8px; transform:translateX(-50%);
  display:flex; flex-wrap:wrap; justify-content:center; gap:9px;
  max-width:344px;                                /* 8×34 + 7×9 = 335，留 9px 余量 */
  z-index:4; pointer-events:none; }
.seatdot{ position:relative; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:800; color:#fff;
  background:rgba(255,255,255,.07);
  transition:box-shadow .3s, background .3s, opacity .3s; }
.seatdot.human{ border:2.5px solid #4da3ff; }     /* 蓝 = 人类 */
.seatdot.ai{ border:2.5px solid #ff5252; }        /* 红 = AI */
.seatdot.dead{ opacity:.32; }
.seatdot.active{ box-shadow:0 0 0 4px rgba(255,213,61,.4);
  background:rgba(255,213,61,.16); }
#dotCursor{ position:absolute; width:0; height:0; display:none;
  border-left:9px solid transparent; border-right:9px solid transparent;
  border-top:11px solid var(--yellow);
  transition:left .45s cubic-bezier(.4,.1,.2,1), top .45s cubic-bezier(.4,.1,.2,1);
  z-index:5; filter:drop-shadow(0 1px 4px rgba(0,0,0,.5)); }
/* 狼夜实时盘子：一个座位格 = 谁点了它 + 几个锁定 */
.wchip { display:inline-block; min-width:52px; padding:4px 6px; border-radius:8px;
         border:1px solid #c9c2b8; background:#fff; text-align:center; font-size:12px; }
.wchip.hot { border-color:#c0392b; background:#fdecea; }

/* 封面上的诊断入口（小字按钮，不抢「开始一局」的视线） */
  .diaglink{margin-top:12px;padding:9px 12px;border-radius:12px;font-family:inherit;
            font-size:13px;color:rgba(255,255,255,.82);background:transparent;
            border:1px dashed rgba(255,255,255,.32);}
  /* 封面在手机上**必须能滚**（2026-09-19 用户报障"开始一局/人数按钮全没了"）。
     原因不是没渲染，是被**裁掉**：`#phone` 是固定高度的 overflow:hidden 列，
     而 `#p0` 又是 `justify-content:center` —— 内容只要比屏幕高，
     **上下会同时被切**（居中 + 溢出是最阴的组合，看着像"按钮消失了"）。
     为什么现在才暴露：批八/批九往封面加了三组控件（玩多大 / AI 性格 / 规则开关，
     其中规则开关由后端表自动生成 ⇒ 条目只会越来越多），把封面顶超了。
     修法：让 `#p0` 自己滚动、内容从**顶部**排；`.mid` 不再 flex:1
     （在滚动容器里 flex:1 会被压成 0，logo 就贴到顶上了）。 */
  #p0{align-items:stretch;justify-content:flex-start;overflow-y:auto;
      -webkit-overflow-scrolling:touch;}
  #p0 .mid{flex:0 0 auto;padding:6px 0 10px;}
  /* ===== 2026-10-12 用户定稿：夜间/投票拨号盘（弃用大圆盘）=====
     页面除号码数字外无文案；顶部 = 角色大字 + 倒计时。 */
  #nightDial{display:none;position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);z-index:7;
    grid-template-columns:repeat(3,1fr);gap:10px;width:min(84vw,350px);}
  #nightDial.on{display:grid;}
  #nightDial button{aspect-ratio:1;border-radius:50%;font-size:30px;font-weight:800;
    font-family:inherit;border:2.5px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.10);color:#fff;padding:0;cursor:pointer;}
  #nightDial button.human{border-color:#4da3ff;}
  #nightDial button.ai{border-color:#ff5252;}
  #nightDial button.dead{opacity:.3;pointer-events:none;}
  #nightDial button.victim{border-color:#ff5a5a;background:rgba(255,90,90,.3);color:#ffd9d9;
    animation:pickBreathe 1.5s ease-in-out infinite;}
  #nightDial button.act{border-color:var(--yellow);color:var(--yellow);
    background:rgba(255,213,61,.12);font-size:15px;}
  #dialHead{display:none;position:absolute;left:50%;top:10px;transform:translateX(-50%);
    z-index:7;text-align:center;width:max-content;pointer-events:none;}
  #dialHead.on{display:block;}
  #dialHead .r{font-size:32px;font-weight:900;color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,.7);line-height:1.3;}
  #dialHead .cd{font-size:36px;font-weight:800;color:var(--yellow);
    font-variant-numeric:tabular-nums;line-height:1.1;}
  #dialHead .cd.urgent{color:#ff5a5a;animation:cdBlink 1s steps(2) infinite;}
  /* ===== 2026-10-12 用户：底部按钮挪右上角（与诊断并排同大小），小字在其下 ===== */
  #topctl{position:fixed;z-index:95;display:flex;gap:8px;
          top:calc(env(safe-area-inset-top,0px) + 6px);
          /* 🔴 锚在**手机框**（#phone）右上角，不是浏览器窗口右上角（用户 2026-10-12） */
          right:calc(50% - min(215px, 50vw) + 56px);}
  #topctl button{width:34px;height:34px;border-radius:50%;font-size:15px;line-height:1;
    background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.28);
    color:#fff;font-family:inherit;padding:0;cursor:pointer;}
  #topctl button:active{opacity:1;}
  .diagfab{right:calc(50% - min(215px, 50vw) + 8px) !important;
           top:calc(env(safe-area-inset-top,0px) + 6px) !important;}
  #series{position:fixed;z-index:94;top:calc(env(safe-area-inset-top,0px) + 46px);
          right:calc(50% - min(215px, 50vw) + 8px);max-width:min(430px,100vw);
          font-size:11px;color:rgba(255,255,255,.62);text-align:right;
          background:transparent;border:none;padding:0;margin:0;}
</style>
</head>
<body>

<div id="phone">

  <!-- ============ 第 0 页：封面 / 开局 ============ -->
  <section class="page on" id="p0">
    <div class="mid">
      <div class="logo">面杀高手</div>
    </div>
    <div class="pad">
      <div class="h2" style="margin-top:18px">定几个人</div>
      <div class="counters">
        <label>真人<input type="number" id="nHuman" min="0" max="8" value="2"></label>
        <label>AI<input type="number" id="nAi" min="0" max="9" value="2"></label>
        <!-- 座次编排（2026-10-01）：默认 = 真人 1 号先发言 + 真人之间均匀隔 AI；
             拖动（电脑）或点两下交换（手机）可任意调。开局时随 /new 发给后端。 -->
        <div id="planWrap" style="margin-top:8px">
          <div id="planRow" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"></div>
          <div style="margin-top:4px">
            <button id="planDefault" class="bigbtn" style="padding:6px 10px;font-size:12px">恢复推荐排位</button>
            <span class="tip" style="font-size:11px">推荐 = 真人先发言、真人之间均匀隔 AI</span>
          </div>
        </div>
      </div>
      <!-- 档位按钮**由 /api/game/rules 动态生成**（见 renderLevels）。
           不写死档位名：否则后端加一档，前端忘改 ⇒ 那一档永远选不到。 -->
      <div class="h2" style="margin-top:16px">玩多大</div>
      <div id="levelRow" class="levels"></div>
      <!-- AI 性格（H2）：从 /api/game/rules 的表生成（含"不配/随机"两个特殊值）。
           人格**与身份无关**（按座位分配、不看角色）⇒ 它不构成身份信号。 -->
      <div class="h2" style="margin-top:16px">AI 性格</div>
      <div id="personaRow" class="levels"></div>
      <!-- 规则开关**由 /api/game/settings 的表生成**（见 renderSwitches）。
           和档位按钮同一个理由：不写死键名与选项，后端加开关前端自动多一个。 -->
      <div class="h2" style="margin-top:16px">规则开关</div>
      <div id="switchRow" class="switches"></div>
      <div id="rulesLine">—</div>
      <button class="bigbtn" id="btnNew">开始一局</button>
      <!-- 2026-10-01（用户要求）：刷新/重开之后**一定停在封面**，不再自动进桌面。
           上一局如果还活着，这个按钮会自己冒出来 —— 接不接回由人决定。
           （不是删掉"断线恢复"，而是**不再替用户做决定**：锁屏/误刷新仍不会丢局。） -->
      <button class="bigbtn" id="btnResume" hidden>继续上一局</button>
      <div class="warn" id="bootMsg"></div>
      <!-- 榜单与战报（2026-10-12 用户：从局末出口挪到设置页底部） -->
      <a class="bigbtn" id="lnkBoard" href="/board" target="_blank" rel="noopener"
         style="display:block;text-align:center;margin-top:10px;text-decoration:none">榜单与战报</a>

      <!-- 模型与语音 key（2026-10-26 用户要求）：默认回填服务端当前配置；
           填好点应用 → 写进服务端并热替换，下一局生效。 -->
      <div class="h2" style="margin-top:18px">模型与语音 Key</div>
      <div id="keysWrap" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <label style="font-size:13.5px;color:rgba(255,255,255,.86)">语音识别 ASR
          <input type="password" id="kAsr" placeholder="ASR_API_KEY"
                 style="width:100%;box-sizing:border-box;margin-top:3px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.24);border-radius:8px;padding:7px 9px;font-family:inherit"></label>
        <label style="font-size:13.5px;color:rgba(255,255,255,.86)">大模型 LLM
          <input type="password" id="kLlm" placeholder="LLM_API_KEY"
                 style="width:100%;box-sizing:border-box;margin-top:3px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.24);border-radius:8px;padding:7px 9px;font-family:inherit"></label>
        <!-- ★ 2026-10-31（用户："接入 LLM key 之后 AI 的发言还是兜底"）：把"现在到底
             是 Mock 还是真模型"直接摆出来 —— 罪魁是 MOCK_LLM=1，以前完全不可见。 -->
        <div id="kLlmNow" style="font-size:12px;color:rgba(255,255,255,.6)"></div>
        <label style="font-size:13.5px;color:rgba(255,255,255,.86)">语音合成 TTS
          <input type="password" id="kTts" placeholder="DASHSCOPE_API_KEY"
                 style="width:100%;box-sizing:border-box;margin-top:3px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.24);border-radius:8px;padding:7px 9px;font-family:inherit"></label>
        <label style="font-size:13.5px;color:rgba(255,255,255,.86)">TTS 通道
          <select id="kTtsMode"
                  style="width:100%;box-sizing:border-box;margin-top:3px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.24);border-radius:8px;padding:7px 9px;font-family:inherit">
            <option value="auto" style="color:#111">自动（有 Key 走云端，否则本地）</option>
            <option value="sapi" style="color:#111">本地 SAPI（免费，单音色）</option>
            <option value="qwen" style="color:#111">云端 Qwen（多音色，按量计费）</option>
          </select></label>
        <div id="kTtsNow" style="font-size:12px;color:rgba(255,255,255,.6)"></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
        <button class="bigbtn" id="btnKeys" style="margin:0">应用 Key / 通道</button>
        <span id="keysMsg" style="font-size:12px;color:rgba(255,255,255,.66)"></span>
      </div>
    </div>
  </section>

  <!-- ============ 第 3 页：身份牌（交接式保密） ============ -->
  <section class="page" id="p3">
    <div class="pad">
      <div class="cfg" id="cfgTop">—</div>
      <div class="cfgnote" id="cfgNote">把手机递给本人，看完牌再交回桌子中央</div>
    </div>
    <div class="cardarea">
      <div class="bigcard" id="bigcard">
        <div class="inner">
          <div class="face front"><div class="q">?</div><div class="t">点一下看牌</div></div>
          <div class="face back" id="bigback"><div class="r">—</div><div class="k">—</div></div>
        </div>
      </div>
    </div>
    <div class="cardhint" id="cardHint">—</div>
    <div class="pad"><button class="bigbtn" id="btnNextCard">看完，交给下一位</button></div>
  </section>

  <!-- ============ 第 4 页：牌桌 ============ -->
  <!-- 2026-10-05 用户定（大改版）：
       ① 顶部金色标题栏整条去掉 —— 公有信息只进底部日志区（renderLog）。
       ② 中间大圆 = 唯一按钮区域 = **轮盘**：可拖动旋转（线下围坐，各自把
          自己的号码转到面前），点数字选中、再点圆心确认，完成
          刀/守/毒/验/枪/投票；夜间的私有信息（队友/验人/被刀）直接标在
          号码刻度上，随轮盘一起转。
       ③ 所有黑色半透明交接卡片（.sheet）取消。 -->
  <section class="page" id="p4">
    <div class="tablewrap" id="tablewrap">
      <div class="table" id="table">
        <div class="tcenter" id="bigCircle">
          <div id="wheelRot"><div class="acts" id="hoActs"></div></div>
          <div class="g" id="bigIcon">⚖️</div>
          <div class="t" id="bigTitle">法官</div>
          <div class="who" id="bigWho"></div>
          <div id="cdNum" aria-label="剩余秒数"></div>
          <div id="seerBig" aria-label="验人结果（好/坏）"></div>
          <div id="wheelBtns">
            <button id="wheelYes" aria-label="使用解药">✓</button>
            <button id="wheelNo" aria-label="不用解药">✕</button>
          </div>
        </div>
      </div>
      <div id="wheelExtra"></div>
      <!-- 座位小圆（2026-10-02 用户追加）：号码 + 人类蓝/AI 红 + 行动光标 -->
      <!-- 座位号码标识排列：2026-10-07 用户定「直接去掉」。
           （`renderDots` / `moveDotCursor` 都自带 `if (!wrap) return`，删掉这个容器即可
            变成空操作；CSS 里的 #seatDots/#dotCursor/.seatdot 已成死样式，下次清理。） -->
      <!-- 票型框（2026-10-28 用户定；2026-10-31 恢复法官播报后仍保留）：
           法官念票型的同时，这个小框显示紧凑票型（首轮 / 加时轮）。
           宽度约竖屏 15%，内容多时上下滚动；每行一条 "2，3→5"。 -->
      <div id="voteBox"></div>
      <!-- 拨号盘（2026-10-12 用户定稿）：夜间操作 + 投票；顶部角色大字 + 倒计时 -->
      <div id="dialHead"><div class="r"></div><div class="cd" id="dialCd"></div></div>
      <div id="nightDial"></div>
      <!-- 大圆发言模式的提示行 + 按钮（2026-10-02：录音状态要看得见；
           识别失败不再自动弹卡片 —— 提示行给指引，「打字」是手动出口） -->
      <div id="spkTip"></div>
      <!-- 「打字 / 过」两个按钮已去掉（2026-10-07 用户定：发言屏只有号码 + 开麦/关麦） -->
      <!-- 大圆发言模式复用 startSay/stopSay（它们要 #hoSay/#hoText/#hoStatus 存在）：
           给一套视觉隐藏的，点击走大圆本体 -->
      <div id="spkHolder">
        <input id="hoText"><div id="hoStatus"></div><button id="hoSay"></button>
      </div>
    </div>
    <!-- 日志区已整体删除（2026-10-12 用户：所有页面都不要）——公有信息以播报为准 -->
    <!-- ⏭ / ↻ 已挪到右上角 #topctl（2026-10-12 用户：与诊断按钮并排同大小） -->
    <div class="footnote" id="foot">—</div>
    <!-- 场次计时（跨局累计）+ 合规提醒横幅。两者都是静态 DOM，
         不能被 foot() 的 textContent 清掉。 -->
    <div class="footnote" id="series">—</div>
    <div id="longUse" class="longuse"></div>
    <!-- 局末出口（静态 DOM，不能被 foot() 的 textContent 清掉）：
         战报只在局末可取 —— 接口层对局中访问会返回 409（战报会揭示所有人身份）。 -->
    <div id="endLinks" class="endlinks">
      <a id="lnkReport" class="bigbtn" target="_blank" rel="noopener">本局战报</a>
      <!-- 2026-10-26（用户定）：导出对局文件挪到游戏结束末尾 —— 和战报一样，
           只有打完才有意义；给提示词实验室复盘/回放用。 -->
      <a id="lnkExportLab" class="bigbtn" href="#" onclick="exportLabFile(event)">⤓ 导出对局文件</a>
    </div>

    <!-- 终局弹框（2026-10-28 用户定）：法官念完「游戏结束，狼人/好人胜利」后弹出。
         静态 DOM，由 renderEndPop() 控制显隐（tableui.js 的 ended 分支每拍调一次）。 -->
    <div id="endPop">
      <div class="eb">
        <div class="eb-who" id="endPopWho">—</div>
        <div class="eb-sub" id="endPopSub">本局结束。下面的「本局战报」可以看完整复盘。</div>
        <button class="eb-btn" id="endPopOk">知道了</button>
      </div>
    </div>

    <!-- 交接浮层已并入轮盘（2026-10-05 用户定：取消所有黑色半透明半屏）。
         #handoff 保留为纯状态标记（class on = 有人拿着手机操作轮盘），
         兼作「打字」兜底输入条的唯一可见内容。 -->
    <div id="handoff">
      <div class="sheet">
        <div class="tip" id="hoTip" style="display:none">—</div>
        <div id="hoSpeak"></div>

/* ============================================================
   对局页接线：真引擎 → 界面

   ============================================================ */

var S = { seats: [], wolfNos: [1], seerNo: null, seatPx: 0, woundBase: 4,
          chords: [], gaps: [], rx: 0, ry: 0 };

var GID = null, RULES = null;
var PUBLIC = null, SPOKEN = 0, SPEAKING = false, PAUSED = false, VOICE_ON = true;
/* 流式播报：正在播的那一句（跳过按钮要能掐掉它）+ 总开关（?nostream=1 强制走老路） */
var SPEAK_STREAM = null;
/* 流式默认关：等 /api/health 的 tts_stream 确认后再开（2026-10-31）。
   本地 SAPI 服务端会明确拒绝 /ws/tts —— 默认开只会每句先吃一次 error。
   ?nostream=1 仍然强制关。 */
var VOICE_STREAM = false;
var LOCAL_LINES = [];        /* 本地产生的提示行（合规提醒等）——它们不在服务端时间线里 */
var WSINCE = 0;              /* 本"场"开始时间（跨局累计，见 seriesSince） */
var WREMINDED = 0;           /* 上次提醒时的分钟数（每小时提醒一次，不刷屏） */
var WAKE = null;             /* 屏幕常亮句柄 */
var HANDOFF = null;          /* 正在交接的座位号（1-based），null = 没人拿着手机 */
var HANDOFF_SIG = null;      /* 手上这屏的"签名"：座位 + 此刻能做的动作（见 sigOf） */
var MYVIEW = null;           /* 交接中那位本人的视图 */
var cardQueue = [];          /* 还没看牌的人类座位 */
var PICK = null;             /* 已选中的目标（点座位后暂存） */
var CARD_FLIPPED = false;    /* 本张身份牌翻过没有（没翻就不让走） */
var BUSY = false;            /* 有一个动作正在提交（真模型要好几秒，必须防连点） */

function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function show(id){
  var ps = document.querySelectorAll('.page');
  for (var i = 0; i < ps.length; i++) ps[i].classList.remove('on');
  $(id).classList.add('on');
}
/* 顶部字幕条已删（2026-10-05 用户定：公有信息只进日志区）——
   setLine 保留为空操作：speakQueue / btnSkip 还在调它。
   法官播报的可见出口是 renderLog() 的日志区。 */
function setLine(t){ /* no-op：字幕条已随顶栏删除 */ }
function foot(t){ $('foot').textContent = t; }

/* ============================================================
   演示模式（2026-10-27）：play.html?demo=<场景名>
   ── 前端同学**不依赖后端**看/改每个面板：页面 100% 真实（同一套渲染
   管线），只有数据来自 frontend/demo_scenes.js 的内置场景，api() 被
   拦截、轮询拉到的永远是场景静态数据。生产路径 DEMO=null，零影响。
   场景清单见 dev_panels.html（iframe 墙，一页看全部场景）。
   ============================================================ */
var DEMO = null;

async function api(path, opts){
  if (DEMO){
    var m = path.match(/\/seat\/(\d+)$/);
    if (m){
      var r = DEMO.roles ? DEMO.roles[Number(m[1])] : null;
      var v = DEMO.public || {};
      /* 🔴 2026-10-27：夜间真面板是**拨号盘**（renderNightDial），它认
         MYVIEW.can_act —— demo 的 seat 视图必须带上（本场景待办座位给
         actions，其余座位空数组），否则认领后 acts=[] → 空转关屏。 */
      var need = (DEMO.ps && DEMO.ps.seats && DEMO.ps.seats[0]) || null;
      var mine = need && need.seat === Number(m[1]);
      var out = { seat: Number(m[1]), role: r ? r.role : 'villager',
        role_label: r ? r.role_label : '村民', alive: true, phase: v.phase,
        round: v.round, players: v.players, speech: v.speech, timeline: v.timeline,
        pending: v.pending, is_my_turn_to_speak: false, is_my_turn_to_vote: false,
        can_act: mine ? (need.actions || []) : [],
        team_mates: (r && r.team_mates) || [] };
      if ((r && r.role) === 'witch') out.potions = { heal: true, poison: true };
      if (v.wolf_points) out.wolf_points = v.wolf_points;
      if (v.wolf_confirmed) out.wolf_confirmed = v.wolf_confirmed;
      if (v.night_victim != null) out.night_victim = v.night_victim;
      if (v.investigations) out.investigations = v.investigations;
      /* 平票加时（2026-10-28）：候选集与"能不能投"都由服务端算，demo 场景也要带上，
         否则画廊里看不到"只有平票候选可点"这一屏。 */
      if (v.runoff) out.runoff = v.runoff;
      return out;
    }
    /* lost 场景：模拟"服务端这一局没了" ⇒ tick 的 catch 走 💀 失控屏 */
    if (path.indexOf('/public') > 0 && DEMO.fail404)
      throw new Error('404 Not Found');
    /* 🔴 2026-10-27 回归修复：/public 这一支必须返回场景数据。上一版把兜底
       改成 `return {ok:true}` 后，tick 的 `PUBLIC = await api('/public')`
       被 {ok:true} 覆盖 ⇒ 所有面板（拨号盘）当场消失，只剩投票那类
       首拍就已渲染好的屏。按路径分别给，别再统一兜底。
       ⚠️ 注释里禁止再写「星号 + 斜杠」的收尾组合：它会把这段块注释提前
       闭合，后半句变成代码 ⇒ 整段脚本 SyntaxError ⇒ 页面停在封面 p0。 */
    if (path.indexOf('/public') > 0) return DEMO.public;
    if (path.indexOf('/pending_seats') > 0) return DEMO.ps || { seats: [] };
    if (path.indexOf('/act') > 0 && DEMO.next && window.DEMO_SCENES
        && DEMO_SCENES[DEMO.next]){
      /* 🔴 2026-10-27：提交后**推进到下一场景**（demo_scenes.js 里每个场景
         用 next 串成一条链）—— 否则静态数据永远停在原状态，提交后底部
         一直显示"AI 正在想…"误导人以为卡了。 */
      var _nx = DEMO_SCENES[DEMO.next];
      DEMO = { public: _nx.public, roles: _nx.roles || DEMO_SCENES.roles || null,
               ps: _nx.public._ps || { seats: [] }, next: _nx.next || null };
      PUBLIC = DEMO.public;
    }
    return { ok: true };                   /* /act、/arm… 提交一律成功 */
  }
  var r = await fetch(path, opts);
  if (!r.ok){ throw new Error(r.status + ' ' + (await r.text()).slice(0, 120)); }
  return await r.json();
}

/* ---------------------------------------------------------- 场次计时 / 合规提醒 / 屏幕常亮 */

/* 合规：连续使用超过 2 小时要**主动提醒**。
   依据《人工智能拟人化互动服务管理暂行办法》（2026-07-15 已施行）。
   一场 4 局 ≈ 2 小时 40 分 ⇒ 正常玩就会触发，所以 MVP 就得有。
   ⚠️ 计时必须**跨局累计**（存 localStorage）：法规说的是"连续使用"，
      不是"单局时长"—— 只按一局算的话永远触发不了，等于没做。 */
function seriesSince(){
  var now = Date.now();
  var v = parseInt(localStorage.getItem('tt.since') || '0', 10);
  /* 隔了 30 分钟以上算"新的一场"（中间放下手机去干别的了）；
     v > now 说明本机时钟被往回调过，也用新值兜住。 */
  if (!v || v > now || (now - v) > 30 * 60 * 1000){
    v = now;
    localStorage.setItem('tt.since', String(v));
  }
  return v;
}

function renderSeries(){
  var mins = Math.max(0, Math.round((Date.now() - WSINCE) / 60000));
  var t = new Date(WSINCE);
  var hh = String(t.getHours()).padStart(2, '0');
  var mm = String(t.getMinutes()).padStart(2, '0');
  var s = '本场 ' + hh + ':' + mm + ' 开始｜已 ' +
          (mins >= 60 ? (Math.floor(mins / 60) + ' 小时 ' + (mins % 60) + ' 分')
                      : (mins + ' 分钟'));
  if (!('wakeLock' in navigator)) s += '｜⚠️ 浏览器不支持常亮，请手动关掉自动锁屏';
  var el = $('series');
  if (el) el.textContent = s;
}

function checkLongUse(){
  var mins = (Date.now() - WSINCE) / 60000;
  /* 超 2 小时起提醒；之后每小时再提一次（避免每 30 秒刷一次屏） */
  if (mins >= 120 && mins - WREMINDED >= 60){
    WREMINDED = mins;
    var h = Math.floor(mins / 60);
    var b = $('longUse');
    if (b){
      b.classList.add('on');
      b.innerHTML = '⏱ 已连续使用 <b>' + h + ' 小时</b> —— 这是按'
        + '《人工智能拟人化互动服务管理暂行办法》做的主动提醒'
        + '（该办法 2026-07-15 已施行，连续使用超 2 小时需提醒）。';
    }
    LOCAL_LINES.push({ t: 'sys', s: '【提醒】已经玩了 ' + h + ' 个小时了，要不要歇一会儿？喝口水再战。' });
    renderLog();
  }
}

async function keepAwake(){
  if (!('wakeLock' in navigator)) return;
  try {
    WAKE = await navigator.wakeLock.request('screen');
    WAKE.addEventListener('release', function(){ WAKE = null; });
  } catch (e) {
    /* 缺用户手势或被系统拒绝：不致命，但夜间闭眼时黑屏容易被当成卡死 */
    var el = $('handoff');
    if (el) $('hoStatus') && ($('hoStatus').textContent = '拿不到屏幕常亮权限，注意手动点亮屏幕');
  }
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && WAKE === null && GID) keepAwake();
});

/* ---------------------------------------------------------- 封面 / 开局 */

/* 模型与语音 key（2026-10-26）：封面加载即回填服务端当前配置；应用后热替换 */
async function loadKeys(){
  try{
    var j = await api('/api/admin/play-keys');
    /* 🔴 2026-11-01（用户实机：Key 明明填了，AI 还是兜底）：非本机请求只回指纹
       （形如 sk-…a506），旧代码把它当真实值回填；用户改别的配置点「应用」时
       原样提交 ⇒ 真实 key 被 8 字符掩码覆盖。掩码一律不进输入框、不提交。 */
    function fillKey(id, v, ph){
      var el = $(id); if (!el) return;
      var masked = !!v && (v.indexOf('…') >= 0 || /^\*+$/.test(v));
      el.value = masked ? '' : (v || '');
      el.placeholder = masked ? '已配置（本机不回显；留空保持不变）' : ph;
      el.dataset.masked = masked ? '1' : '';
    }
    fillKey('kAsr', j.asr, 'ASR_API_KEY');
    fillKey('kLlm', j.llm, 'LLM_API_KEY');
    fillKey('kTts', j.tts, 'DASHSCOPE_API_KEY');
    $('kTtsMode').value = j.tts_mode || 'sapi';
    /* 配置台只写 key 不会替你切通道：TTS=sapi 时云端 key 是不生效的（2026-10-31
       用户填了 key 仍没 AI 声，就是因为这里没有可选项）。现在把"实际在用哪个"
       直接摆出来，并让用户自己选通道。 */
    var _now = j.tts_active ? ('当前实际：' + j.tts_active) : '当前实际：未知';
    _now += j.tts_mocked ? '（Mock —— 这里的 Key 不生效）'
          : ((j.tts_active === 'QwenTts' && !j.tts_key_present)
              ? '（未配置 TTS Key —— 云端不可用）'
              : (j.tts_stream ? '（流式可用）' : '（非流式：AI 逐句走 /api/tts）'));
    $('kTtsNow').textContent = _now;
    /* ★ 2026-10-31：LLM 的"当前实际"同样摆出来。`Mock` 时填 key 也不会生效
       （MOCK_LLM=1 装配的是 MockLlm），而用户只能从"AI 老是说兜底话术"里猜。 */
    var _llmSet = (typeof j.llm_set === 'boolean')
      ? j.llm_set : !!(j.llm && j.llm.indexOf('…') < 0);
    var _llmNow = j.llm_active ? ('当前实际：' + j.llm_active) : '当前实际：未知';
    _llmNow += j.llm_mocked
      ? '（Mock —— 这里的 Key 不生效；填好 Key 点应用会自动切到真实模型）'
      : ('（真实模型：' + (j.llm_model || '未配置模型')
         + (_llmSet ? (j.llm && j.llm.indexOf('…') >= 0 ? '，Key 已配置（本机不回显）' : '')
                    : '，但未配置 Key —— 调用会退回兜底') + '）');
    if ($('kLlmNow')) $('kLlmNow').textContent = _llmNow;
    /* 2026-10-26 一致性检查（用户要求）：实验室第①列席位接管对局 LLM 时必须如实说，
       否则这里填的 LLM key 下一局"看起来生效了"其实被席位覆盖挡住。 */
    if (j.llm_override)
      $('keysMsg').textContent = '⚠️ 对局的 LLM 目前走实验室第①列席位（覆盖此处的 LLM key）；ASR / TTS 以这里为准';
  }catch(e){ $('keysMsg').textContent = '当前配置读取失败：' + e.message; }
}

/* AI 发言走流式还是整句：由服务端当前 TTS 实现决定（2026-10-31）。
   SAPI 不能服务 /ws/tts —— 以前每句都先连一次 WS、吃一个 error 再回落
   /api/tts，诊断面板还会把那条预期内的 error 当成"AI 没声"的证据。 */
async function refreshVoiceCaps(){
  try{
    var h = await api('/api/health');
    if (!/[?&]nostream=1/.test(location.search))
      VOICE_STREAM = !!h.tts_stream;
    return h;
  }catch(e){ return null; }
}
async function applyKeys(){
  var msg = $('keysMsg');
  /* 掩码占位 + 没重新输入 ⇒ 发空串（服务端会跳过），绝不把指纹写回。 */
  function keyValue(id){
    var el = $(id); if (!el) return '';
    var v = el.value.trim();
    return (el.dataset.masked === '1' && !v) ? '' : v;
  }
  try{
    var r = await api('/api/admin/play-keys', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ asr: keyValue('kAsr'),
                             llm: keyValue('kLlm'),
                             tts: keyValue('kTts'),
                             tts_mode: $('kTtsMode').value })
    });
    msg.textContent = (r.changed && r.changed.length ? '已更新（' + r.changed.join('、') + '）—— ' : '没有变化 —— ')
      + (r.note || '');
    await loadKeys();
    await refreshVoiceCaps();
  }catch(e){ msg.textContent = '应用失败：' + e.message; }
}

async function boot(){
  /* 2026-10-12（用户）：识别/大脑/说话那行装配文案删除 —— 诊断面板里全都有。 */
  try {
    /* 组局规则只有服务端一份，前端只负责显示 —— 不在这里自己再算一遍狼数，
       否则规则一改就会两边漂移。 */
    RULES = await api('/api/game/rules');
    $('nHuman').oninput = renderRules;
    $('nAi').oninput = renderRules;
    renderRules();
    renderLevels();
    renderPersonas();
    loadSettings();
  } catch (e) { $('bootMsg').textContent = '读不到组局规则：' + e.message; }
}

/* ---------------------------------------------------------- 规则开关（G9） */
/* 控件**由服务端那张表生成**，前端不写死"有哪几个开关、哪个是勾选哪个是下拉"。
   改完立刻 POST 保存；只影响**新开的局**（服务端不让中途改规则）。 */
var SWITCHES = null, SETTINGS = {};

async function loadSettings(){
  try {
    var d = await api('/api/game/settings');
    SWITCHES = d.switches || [];
    SETTINGS = d.current || {};
    renderSwitches();
  } catch (e){
    $('switchRow').innerHTML = '<span class="bad">读不到规则开关：' + e.message + '</span>';
  }
}

function renderSwitches(){
  var row = $('switchRow');
  row.innerHTML = '';
  (SWITCHES || []).forEach(function(s){
    var wrap = document.createElement('label');
    wrap.className = 'sw';
    wrap.title = s.note || '';
    var cur = (s.key in SETTINGS) ? SETTINGS[s.key] : s.default;
    if (s.type === 'bool'){
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!cur;
      cb.onchange = function(){ saveSwitch(s.key, cb.checked); };
      wrap.appendChild(cb);
      wrap.appendChild(document.createTextNode(s.label));
    } else {
      var sel = document.createElement('select');
      (s.options || []).forEach(function(o){
        var op = document.createElement('option');
        op.value = o.value;
        op.textContent = o.label;
        if (o.value === cur) op.selected = true;
        sel.appendChild(op);
      });
      sel.onchange = function(){ saveSwitch(s.key, sel.value); };
      wrap.appendChild(document.createTextNode(s.label + '：'));
      wrap.appendChild(sel);
    }
    row.appendChild(wrap);
  });
}

async function saveSwitch(key, val){
  var one = {};
  one[key] = val;
  try {
    var d = await api('/api/game/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ settings: one })
    });
    SETTINGS = d.current || {};
    renderSwitches();
  } catch (e){
    $('bootMsg').textContent = '规则开关没保存成功：' + e.message;
  }
}

/* ---------------------------------------------------------- AI 性格（H2） */
var PERSONA = 'off';    /* 缺省不配人格（缺省就是"没有这个功能"的旧行为） */

function renderPersonas(){
  if (!RULES) return;
  var row = $('personaRow');
  row.innerHTML = '';
  var items = (RULES.personality_specials || []).concat(RULES.personalities || []);
  items.forEach(function(x){
    var b = document.createElement('button');
    b.textContent = x.label || x.key;
    b.className = (x.key === PERSONA) ? 'on' : '';
    b.title = x.brief || '';
    b.onclick = function(){ PERSONA = x.key; renderPersonas(); };
    row.appendChild(b);
  });
  var cur = items.filter(function(x){ return x.key === PERSONA; })[0];
  if (cur && cur.brief) b.title = cur.brief;   /* 只留悬停提示，页面不再显示文案 */
}

var LEVEL = null;   /* 选中的档位（娱乐/认真/硬核/地狱）；null = 规则还没读回来 */

/* 档位按钮：**从服务端那份表生成**，不写死名字（后端加一档这里就自动多一个按钮）。
   默认选「认真」而不是后端缺省的「娱乐」——后端缺省是为了兼容旧调用方（测试/脚本），
   不是给玩家用的默认值；玩家打开页面想要的是中间那档。 */
function renderLevels(){
  if (!RULES || !RULES.levels || !RULES.levels.length) return;
  var row = $('levelRow');
  row.innerHTML = '';
  var names = RULES.levels.map(function(x){ return x.key; });
  if (names.indexOf(LEVEL) < 0) LEVEL = (names.indexOf('认真') >= 0) ? '认真' : names[0];
  RULES.levels.forEach(function(x){
    var b = document.createElement('button');
    b.textContent = x.key;
    b.className = (x.key === LEVEL) ? 'on' : '';
    b.onclick = function(){ LEVEL = x.key; renderLevels(); };
    row.appendChild(b);
  });
}

/* 人数 → 会配成几狼几神几民。人数不合法时直接说明原因，不让玩家点下去才发现。 */
function renderRules(){
  if (!RULES) return false;
  var nh = parseInt($('nHuman').value, 10) || 0;
  var na = parseInt($('nAi').value, 10) || 0;
  var p = (RULES.preview || {})[String(nh + na)];
  var why = '';
  /* 2026-10-26 放行全 AI 局：后端（game_api / make_board）本来就允许 humans=0，
     这里只是前端自己的规则 —— 0 真人时交给下面的「支持范围」检查兜底。 */
  if (nh < 0 || na < 0) why = '人数不能为负';
  else if (nh + na > 9) why = '真人 + AI 最多 9 人';
  else if (!p) why = (nh + na) + ' 人不在支持范围（4–16）';
  else if (!p.ok) why = p.reason;
  if (why) { $('rulesLine').innerHTML = '<span class="bad">' + why + '</span>'; return false; }
  $('rulesLine').innerHTML = '共 <b>' + (nh + na) + '</b> 人　' + p.label
    + (nh === 0 ? '　（全 AI 局：自动推进，只围观）' : '');
  buildPlan();                            /* 人数变了就重排座次（长度没变则保留手排） */
  return true;
}

/* ================================================================ 座次编排（2026-10-01）
   默认：真人坐 1 号先发言，真人之间均匀隔 AI（环形间隔尽量一致 —— 与后端
   game_api.default_layout 同一套算法，**两边必须一致**：前端给预览，后端兜底）。
   拖动（电脑）/ 点两下交换（手机）可任意调；开局时把整个数组发给 /api/game/new。 */
var PLAN = [];
function defaultPlan(nh, na){
  var out = [], i;
  if (nh <= 0){ for (i = 0; i < na; i++) out.push('ai'); return out; }
  if (na < nh){ for (i = 0; i < nh; i++) out.push('human');
                for (i = 0; i < na; i++) out.push('ai'); return out; }
  var base = Math.floor(na / nh), extra = na % nh, g, k;
  for (g = 0; g < nh; g++){
    out.push('human');
    var gap = base + (g < extra ? 1 : 0);
    for (k = 0; k < gap; k++) out.push('ai');
  }
  return out;
}
function buildPlan(){
  var nh = parseInt($('nHuman').value, 10) || 0;
  var na = parseInt($('nAi').value, 10) || 0;
  var n = nh + na;
  var wrap = $('planWrap'); if (!wrap) return;
  if (n <= 0){ wrap.style.display = 'none'; PLAN = []; return; }
  wrap.style.display = 'block';
  /* 🔴 2026-10-26 修：只比长度会漏 —— 上局 2真人2AI（长4）→ 这局 0真人4AI（长4），
     长度相同但真人计数不同，旧 PLAN 直接发后端 ⇒ 400「layout 人数不一致」。
     长度**和**真人计数都对上才复用，否则重建默认座次。 */
  var hn = 0, k;
  for (k = 0; k < PLAN.length; k++) if (PLAN[k] === 'human') hn++;
  if (PLAN.length !== n || hn !== nh) PLAN = defaultPlan(nh, na);
  var h = '';
  for (var i = 0; i < n; i++){
    h += '<span class="planChip ' + (PLAN[i] === 'human' ? 'ph' : 'pa')
      + '" data-i="' + i + '" draggable="true">' + (i + 1) + '号·'
      + (PLAN[i] === 'human' ? '真人' : 'AI') + '</span>';
  }
  $('planRow').innerHTML = h;
  bindPlan();
}
function bindPlan(){
  var sel = null, dragI = null;
  var chips = document.querySelectorAll('#planRow .planChip');
  for (var i = 0; i < chips.length; i++){
    (function(ch){
      var idx = function(){ return parseInt(ch.getAttribute('data-i'), 10); };
      ch.onclick = function(){
        /* 点两下交换：手机上没有拖拽，这是等价操作 */
        if (sel === null){ sel = idx(); ch.classList.add('sel'); return; }
        if (sel === idx()){ sel = null; ch.classList.remove('sel'); return; }
        var t = PLAN[sel]; PLAN[sel] = PLAN[idx()]; PLAN[idx()] = t;
        sel = null; buildPlan();
      };
      ch.addEventListener('dragstart', function(){ dragI = idx(); ch.classList.add('drag'); });
      ch.addEventListener('dragend', function(){ ch.classList.remove('drag'); });
      ch.addEventListener('dragover', function(e){ e.preventDefault(); });
      ch.addEventListener('drop', function(e){
        e.preventDefault();
        if (dragI === null || dragI === idx()) return;
        var m = PLAN.splice(dragI, 1)[0];
        PLAN.splice(idx(), 0, m);
        dragI = null; buildPlan();
      });
    })(chips[i]);
  }
  var def = $('planDefault');
  if (def) def.onclick = function(){
    PLAN = defaultPlan(parseInt($('nHuman').value, 10) || 0,
                       parseInt($('nAi').value, 10) || 0);
    buildPlan();
  };
}

async function exportLabFile(ev){
  ev.preventDefault();
  try{
    var r = await fetch('/api/lab/export');
    if (!r.ok) throw new Error('HTTP ' + r.status);

    }

    a.download = 'lab-export-' + (j.gid || '') + '-' + new Date().toISOString().slice(0,16).replace(/[:T]/g,'') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert('导出失败：' + e.message); }

/* 死亡图标什么时候暗（2026-10-28 用户定："在法官播报死亡信息后……立即暗掉"）。
   ⚠️ 不能只看 `players[].alive`：那个字段在**结算那一刻**就变假了，而死讯
   还要在播报队列里排队（前面可能压着好几句），于是图标会**先暗、后听到死讯**。
   后端把"哪一句宣布了谁出局"结构化地挂在 timeline 条目的 `dead` 上
   （engine.log(..., dead=[...]) → speech_io._flush_log），这里等那句被念到
   （SPOKEN 越过它）再暗。
   三个兜底，缺一不可：
     · 语音关掉（VOICE_ON=false）⇒ 没人会来推进 SPOKEN ⇒ 直接暗
     · 老服务端没有 `dead` 字段 ⇒ 按 alive 立即暗（保持旧观感）
     · 播报卡住（TTS 悬挂）⇒ 这句挂上去 20 秒后照暗，不能因为念不出来就一直亮着 */
function deadHeard(){
  var tl = (PUBLIC && PUBLIC.timeline) || [];
  var marked = {}, heard = {};
  var now = Date.now() / 1000;
  for (var i = 0; i < tl.length; i++){
    var d = tl[i].dead;
    if (!d || !d.length) continue;
    for (var k = 0; k < d.length; k++) marked[d[k]] = true;
    var playable = (typeof VOICE_ON !== 'undefined') && VOICE_ON;
    var spoken = (typeof SPOKEN === 'number') && SPOKEN > i;
    var stale = now - Number(tl[i].at || tl[i].ts || 0) > 20;
    if (!playable || spoken || stale){
      for (var k2 = 0; k2 < d.length; k2++) heard[d[k2]] = true;
    }
  }
  return { marked: marked, heard: heard };
}

function paintSeats(){
  if (!PUBLIC) return;
  var _dh = deadHeard();
  (PUBLIC.players || []).forEach(function(p){
    if (p.alive) return;
    /* 有"死讯那一句"就等它念到；没有（老服务端 / 老的死者）就立即暗。 */
    if (!_dh.marked[p.seat] || _dh.heard[p.seat]) addCls(p.seat + 1, 'dead');
  });
  /* 2026-10-29（用户：做「当前发言玩家高亮」）：
     · 遗言相位下 current_speaker 是 null —— 那时认 lastword_seat，
       否则"出局的人正在留遗言"这一整段没有任何高亮。
     · 只看 current_speaker 还不够：它在 VOTE / NIGHT 是 null，
       不会误亮（这是对的 —— 夜里高亮该由 .acting 负责）。 */
  var _spk = (PUBLIC.current_speaker != null) ? PUBLIC.current_speaker
           : ((PUBLIC.lastword_seat != null) ? PUBLIC.lastword_seat : null);
  (PUBLIC.players || []).forEach(function(p){
    if (_spk === p.seat) addCls(p.seat + 1, 'speaking');
    else delCls(p.seat + 1, 'speaking');
  });
  /* ★ 2026-10-29（用户）：真正给玩家看的是**轮盘上那圈号码**（.wnum）——
     上面那套往 .seat 上加的类在 #p4 是 display:none，等于没加。

  try { paintNumberGlow(); } catch (e) { /* 老页面没有这个函数 */ }
}

function renderVoteBox(){

/* 终局弹框：法官念完「游戏结束，狼人/好人胜利」之后才弹。
   ★ 2026-10-29（用户："法官语音播报游戏结束后才显示弹框……上一把弹框没了"）：
   上一版只有「SPOKEN 越过那一句」和「进终局 8 秒」两条路，实测有洞：
     · **语音队列卡在更早的句子上**时 SPOKEN 永远追不上（这设备上法官播报本来就是
       老大难），只能等 8 秒；
     · **中途刷新/重开页面**时 SPOKEN 从 0 开始，那一局历史有 40 多条播报要一句句
       过一遍，用户对着"本局结束"干等几十秒，体感就是"弹框没了"。
   现在判据是"**播报已经不该再等**"，四条路任意一条成立就弹：
     ① 语音关掉 / 老服务端没有这一句        → 没人会念，直接弹
     ② SPOKEN 真的越过了那句                → 正解
     ③ 队列已经空闲（!SPEAKING）超过 1.5 秒 → 卡住的兜底（比死等 8 秒快得多）
     ④ 那句「游戏结束」本身是 20 秒前的     → 刷新/接回旧局时照弹
     ⑤ 最后硬兜底：进终局 8 秒
   弹框只负责"什么时候弹"；"是不是真的结束了"仍然只看服务端的 phase/winner。 */
var _END_AT = 0, _END_SHOWN = false;
function renderEndPop(){
  var p = $('endPop');
  if (!p) return;
  if (!PUBLIC || PUBLIC.phase !== 'ended'){
    p.classList.remove('on');
    _END_AT = 0; _END_SHOWN = false;
    return;
  }
  if (!_END_AT) _END_AT = Date.now();
  var who = PUBLIC.winner === 'wolf' ? '狼人胜利'
          : (PUBLIC.winner === 'good' ? '好人胜利' : '本局结束');
  var whoEl = $('endPopWho');
  if (whoEl) whoEl.textContent = who;
  var idx = -1;
  ((PUBLIC.timeline) || []).forEach(function(x, i){
    if (x.t === 'sys' && String(x.s || '').indexOf('游戏结束') === 0) idx = i;
  });
  var _tl = PUBLIC.timeline || [];
  var _lineAt = (idx >= 0 && _tl[idx]) ? Number(_tl[idx].at || _tl[idx].ts || 0) : 0;
  var spoken = (idx < 0) || !VOICE_ON
            || (typeof SPOKEN === 'number' && SPOKEN > idx)
            /* ③ 队列空闲了 1.5 秒还没轮到那句 ⇒ 别死等（TTS 悬挂是最常见的形态） */
            || (typeof SPEAKING !== 'undefined' && !SPEAKING
                && Date.now() - _END_AT > 1500)
            /* ④ 那句本身就是 20 秒前的：刷新页面 / 接回旧局，播报早该放完了 */
            || (_lineAt > 0 && Date.now() / 1000 - _lineAt > 20)
            /* ⑤ 硬兜底 */
            || (Date.now() - _END_AT > 8000);
  if (!spoken || _END_SHOWN) return;
  _END_SHOWN = true;
  p.classList.add('on');
}

   原来：调 newGame() 用同一套配置**直接再开一局**。
   现在：停轮询、回到封面。封面上那几个输入框还留着上一局的值，所以想"同样配置
   再来一局"只要再按一下「开始一局」—— 只多一步，但人**看得见自己在开什么**。
   ⚠️ 没有删掉"接回上一局"的能力：那一局还在服务端活着，封面上的
      「继续上一局」按钮会把它显示出来（见 backToCover / showResumeButton）。 */
$('btnAgain').onclick = function(){
  if (!confirm('回到初始界面？（这一局还活着，封面上的「继续上一局」能接回来）')) return;
  backToCover();
};

/* 回到开始界面：留住"还能接回"的锚点、显示接回按钮、停轮询（tick 自己会停）、换页。 */
function backToCover(){
  if (GID) localStorage.setItem('tt.gid', GID);   /* 锚点留着 ⇒ 那一局还能接回 */
  /* 终局弹框不能带到封面上（tick 停了就没人收它） */
  if ($('endPop')) $('endPop').classList.remove('on');
  showResumeButton(GID
    ? ('继续上一局（局号 ' + GID + '，'
       + (PUBLIC && PUBLIC.phase === 'ended' ? '已结束' : '进行中') + '）')
    : '', GID);
  try { closeHandoff(); } catch (e) { /* 不在交接屏上就算了 */ }
  show('p0');
  foot('回到开始界面。想接着上一局，就点「继续上一局」。');
}

/* 封面上那个「继续上一局」按钮：有活着的局才显示（text 为空 ⇒ 藏起来）。
   ⚠️ 局号必须由参数带进来：从"刷新后停在封面"这条路径过来时 GID 还是空的。 */
function showResumeButton(text, gid){
  var b = $('btnResume');
  if (!b) return;
  if (!text || !gid){ b.hidden = true; b.onclick = null; return; }
  b.hidden = false;
  b.textContent = text;
  b.onclick = async function(){
    try {
      var p2 = await api('/api/game/' + gid + '/public');
      resumeInto(gid, p2);
    } catch (e) {
      localStorage.removeItem('tt.gid');       /* 服务端重启过 / 局被挤掉了 */
      showResumeButton('');
      foot('那一局在服务端已经不在了：' + e.message);
    }
  };
}

/* 真正接回上一局（**只有用户按了那个按钮才会走到这里**，不再自动）。 */
function resumeInto(gid, pub){
  GID = gid; PUBLIC = pub;
  SPOKEN = 0; HANDOFF = null; MYVIEW = null; PICK = null; LOCAL_LINES = [];
  if (typeof SPOKE_DONE !== 'undefined') SPOKE_DONE = null;   /* 接局：播报游标从零开始 */
  if (typeof LOCAL_SPOKEN !== 'undefined') LOCAL_SPOKEN = 0;
  cardQueue = [];                    /* 身份牌已经看过了，不再走那一轮 */
  showResumeButton('');              /* 进桌面了，封面那个按钮收起来 */
  enterTable();
  foot(pub.phase === 'ended'
    ? '本局已结束 —— 可以看下面的「本局战报」'
    : ('已接回上一局（局号 ' + gid + '），继续吧'));
}

window.addEventListener('resize', function(){ if ($('p4').classList.contains('on')) layout(); });

/* ---------------------------------------------------------- 启动 */
/* 🔴 2026-10-12（用户："我刚刚打开游戏"却显示已 23 分钟）：本场起点原来存
   localStorage（跨页面续算，30 分钟内都算同一场）⇒ 显示与体感不符。
   现在：**本场 = 本次打开页面的时刻**，小字从打开那一刻起算。 */
WSINCE = Date.now();
renderSeries();
setInterval(renderSeries, 30000);
setInterval(checkLongUse, 30000);

/* 断线/刷新恢复 —— **2026-10-01 改了行为**：
   原来：本地存着局号就**自动接回桌面**（刷新一下就直接进了牌桌）。
   用户意见：「强刷界面，都是以同配置开一局，这不合理，应该直接回到初始界面」。
   现在：**刷新一定停在封面**；若那一局还活着，封面上出现「继续上一局」按钮。
   恢复能力一点没少（锁屏 / 误刷新不会把一局弄丢），只是**不再替用户做决定**。
   服务端重启过（404）⇒ 清掉本地锚点并藏起按钮。 */
async function tryResume(){
  var gid = localStorage.getItem('tt.gid');
  if (!gid) { showResumeButton(''); return; }
  try {
    var pub = await api('/api/game/' + gid + '/public');
    showResumeButton('继续上一局（局号 ' + gid + '，'
      + (pub.phase === 'ended' ? '已结束' : '进行中') + '）', gid);
  } catch (e) {
    localStorage.removeItem('tt.gid');   /* 服务端重启过了：别让下次还试 */
    showResumeButton('');
  }
}

function loadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('加载失败：' + src)); };
    document.head.appendChild(s);
  });
}

(async function start(){
  /* 演示模式：?demo=<场景名> —— 不连服务、不 boot，直接进场景 */
  var dm = /[?&]demo=([\w-]+)/.exec(location.search);
  if (dm){
    try {
      await loadScript('/demo_scenes.js');
    } catch (e) {
      document.body.innerHTML = '<p style="padding:20px">演示场景脚本加载失败（'
        + e.message + '）—— 请用服务打开（mock :5501 / 后端 :8000），别用 file://</p>';
      return;
    }
    var sc = DEMO_SCENES[dm[1]];
    if (!sc){
      document.body.innerHTML = '<p style="padding:20px">未知场景「' + dm[1]
        + '」。可用：' + Object.keys(DEMO_SCENES).join(' / ') + '</p>';
      return;
    }
    if (sc.kind === 'cover'){
      /* 封面场景：不进牌桌。走**真实的 boot()**（rules/settings 由 mock 给），
         再伪造一个"上一局还在"的 local 锚点 ⇒ 「继续上一局」按钮也一并出画，
         黄子凡调封面不需要先开一局。 */
      DEMO = null;
      localStorage.setItem('tt.gid', 'MOCKGID');
      await boot();
      await tryResume();
      show('p0');
      foot('');
      return;
    }
    if (sc.kind === 'cards'){
      DEMO = { public: sc.public, roles: sc.roles, ps: { seats: [] } };
      GID = 'DEMO'; PUBLIC = sc.public;
      cardQueue = [0, 1, 2, 3];            /* 4 张身份牌轮着翻，翻完顺势进桌 */
      nextCard();
    } else {
      /* next 必须带上：否则 DEMO.next 恒为 undefined，提交后推进分支
         （api() 里的 /act）永远不触发，点了号码就一直停在"AI 正在想…" */
      DEMO = { public: sc.public, roles: sc.roles, fail404: !!sc.fail404,
               ps: sc.public._ps || { seats: [] }, next: sc.next || null };
      GID = 'DEMO'; PUBLIC = sc.public;
      VOICE_ON = false;                    /* 演示模式关语音：播报门（voicedUp）恒过，面板直接出 */
      resumeInto('DEMO', sc.public);
    }
    return;
  }
  /* 先问清楚服务端 TTS 能不能流式，再决定 AI 发言走哪条路（2026-10-31）。
     必须赶在 tryResume 之前：`?gid=` 会立刻接进进行中的局，首句就已经要播了。 */
  await refreshVoiceCaps();
  boot();
  await tryResume();
  /* ★ 2026-10-29：`?gid=<局号>` 直接接进指定那一局（不进封面）。
     用途只有两个：无头浏览器截图验收（否则要先在页面上点开局、再等半天），
     以及前端负责人/队友复现某一局。**不改变正常入口**：不带这个参数时
     仍然"永远从封面开始"。 */
  var _qg = /[?&]gid=([\w-]+)/.exec(location.search);
  if (_qg){
    /* ⚠️ 先落到一个**普通变量**再用：_check-split-consistency 把
       `'/api/game/' + X + '/public'` 归一化成 {param} 靠的是"标识符"，
       写成 `_qg[1]` 这种带下标的它认不出来，会误报"前端调了不存在的接口"。 */
    var _qgid = _qg[1];
    try {
      var _qpub = await api('/api/game/' + _qgid + '/public');
      resumeInto(_qgid, _qpub);
      return;
    } catch (e) { /* 那一局没了 ⇒ 老老实实留在封面 */ }
  }
  show('p0');            /* **永远从封面开始**：要接着上一局，就按上面的「继续上一局」 */
})();

$('btnNew').onclick = newGame;
$('btnKeys').onclick = applyKeys;
loadKeys();

/* 身份牌页的「看完，交给下一位」。
   这里原本漏了绑定 —— 点它没反应，整局就卡在身份牌那一步（用页面点出来才发现）。
   顺手加一道保险：没翻牌就点，只提示、不前进 —— 否则有人会不知道自己是什么身份就开局。 */
$('btnNextCard').onclick = function(){
  if (!CARD_FLIPPED){
    $('cardHint').textContent = '先点一下上面的牌子，看自己的身份';
    return;
  }
  nextCard();
};
</script>
