<!DOCTYPE html>
<!-- ============================================================
  前端面板画廊（2026-10-27，给黄子凡）· iframe 墙版
  ── 每一格都是**真的 play.html**（?demo=场景：内置假数据 + 真实渲染
  管线，不连后端），所见即产品所得，不存在两份样式。

  用法：python mock/mock_server.py → 开 http://127.0.0.1:5501/dev_panels.html
  改样式（table.css / play.html / tableui.js）后刷新本页即见全部场景。

  加新场景：在 frontend/demo_scenes.js 的 DEMO_SCENES 里加一项 +
  下面 SCENES 里加一格。要练交互流转：:5501/play.html（mock 假数据）。
============================================================ -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面板画廊 · demo 场景墙</title>
<style>
  body{margin:0;background:#241a3f;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#fff;}
  .head{padding:18px 16px 6px;}
  .head h1{font-size:20px;margin:0 0 4px;}
  .head p{font-size:13px;color:#c9bfe8;margin:2px 0;}
  .wall{display:flex;flex-wrap:wrap;gap:20px;padding:14px 16px 40px;align-items:flex-start;}
  .cell{width:390px;}
  .cell>h2{font-size:15px;margin:0 0 2px;color:#ffd76a;}
  .cell>.note{font-size:12px;color:#b6abd8;margin:0 0 8px;min-height:16px;}
  .frame{width:390px;height:720px;border:1px solid rgba(255,255,255,.18);border-radius:14px;
         background:#171029;overflow:hidden;}
  .frame iframe{width:100%;height:100%;border:0;}
</style>
</head>
<body>
<div class="head">
  <h1>面板画廊（demo 场景墙）</h1>
  <p>每一格都是真页面 play.html 的演示模式（内置假数据、真实渲染管线）—— 改样式刷新即见，所见即产品所得。</p>
  <p>交互演练：:5501/play.html（mock 假数据）· 真实全流程：MOCK 后端 /play · 本页不连后端。</p>
</div>
<div class="wall" id="wall"></div>
<script>
var SCENES = [
  ['cards',        '身份牌 · 逐座位翻牌（狼/预/巫/守/民）', '翻面样式按座位轮换；卡片文案与狼队友提示来自 demo seat 数据'],
  ['night_wolf',   '夜 · 狼人刀人（拨号盘）',   '先认领（点圆心）→ 大数字键盘选刀口；🐺队友 / 🔪刀标'],
  ['wolf_confirm', '夜 · 狼刀确认（多狼第二步）', '队友已点 🔪 且确认 → 你点圆心确认整夜刀口'],
  ['night_witch',  '夜 · 女巫（解药 ✓✕）',     '5 号被刀 ☠️ 标记；空刀夜看解药按钮置灰'],
  ['witch_poison', '夜 · 女巫（毒药问）',       '同一晚第二问；拨号盘选毒药目标'],
  ['night_seer',   '夜 · 预言家（验人）',       '拨号盘点号码；验完 👍/👎 大字'],
  ['night_guard',  '夜 · 守卫（守人）',         '拨号盘点号码 = 守他'],
  ['day_say',      '白天 · 轮到真人发言',       '大圆发言模式：点一下开始录音、再点结束'],
  ['vote',         '投票（点号码 → 圆心确认）',   '投票允许投自己；已投 AI 有标记'],
  ['vote_result',  '投票结果（票型大字）',       '#voteBig 只摆票型不显示 AI 文本'],
  ['hunter',       '猎人开枪（轮盘 · 可放弃）',   'shoot 走大圆轮盘；wheelExtra「不开枪」'],
  ['last_words',   '出局遗言（AI 播报中）',      '无面板：法官播报 + AI 遗言逐句上屏'],
  ['ended',        '终局（胜负 + 战报入口）',     'winner 非 null 即结束；局末出口此时才出现']
];
var wall = document.getElementById('wall');
for (var i = 0; i < SCENES.length; i++){
  var c = SCENES[i];
  var d = document.createElement('div');
  d.className = 'cell';
  d.innerHTML = '<h2>' + (i + 1) + '. ' + c[1] + '</h2>'
    + '<p class="note">' + c[2] + '</p>'
    + '<div class="frame"><iframe src="play.html?demo=' + c[0] + '" loading="lazy"></iframe></div>';
  wall.appendChild(d);
}
</script>
</body>
</html>
