<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>P0-talk · 说一句试试</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 18px; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #FAFAF7; color: #1F1F1D; font-size: 15px; line-height: 1.6;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .env { font-size: 12px; color: #6B6B66; margin-bottom: 18px; }
  .env b { color: #185FA5; }
  .hint {
    background: #E6F1FB; border: 1px solid #378ADD; border-radius: 10px;
    padding: 11px 14px; font-size: 13px; color: #042C53; margin-bottom: 18px; line-height: 1.65;
  }
  .mic {
    width: 100%; padding: 26px; border: none; border-radius: 14px;
    background: #185FA5; color: #fff; font-size: 17px; font-weight: 600;
    font-family: inherit; cursor: pointer; user-select: none;
    transition: background .12s, transform .06s;
  }
  .mic:active, .mic.on { background: #A32D2D; transform: scale(0.985); }
  .mic:disabled { background: #B4B2A9; }
  .status { text-align: center; font-size: 13px; color: #6B6B66; margin: 10px 0 18px; min-height: 20px; }
  .card {
    background: #fff; border: 1px solid #E5E3DC; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card .k { font-size: 12px; color: #6B6B66; margin-bottom: 5px; }
  .card .v { font-size: 16px; word-break: break-word; }
  .card.err { background: #FCEBEB; border-color: #E24B4A; }
  .card.err .v { color: #501313; font-size: 13px; }
  .card.ai { background: #EAF3DE; border-color: #639922; }
  .card.ai .v { color: #173404; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
  td { padding: 5px 0; border-bottom: 1px solid #F0EEE8; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .rowbtn { display: flex; gap: 10px; margin-top: 14px; }
  .rowbtn button {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #378ADD;
    background: #E6F1FB; color: #042C53; font-size: 14px; font-family: inherit; cursor: pointer;
  }
  .log { font-size: 12px; color: #6B6B66; margin-top: 18px; line-height: 1.7; }
  .banner {
    border-radius: 10px; padding: 12px 14px; font-size: 13px;
    margin-bottom: 14px; line-height: 1.7;
  }
  .banner.warn { background: #FCEBEB; border: 1px solid #E24B4A; color: #501313; }
  .banner.info { background: #EAF3DE; border: 1px solid #639922; color: #173404; }
  .banner b { font-weight: 600; }
  td.l { text-align: left; }
  td.l:last-child { text-align: left; }
</style>
</head>
<body>

<h1>P0-talk</h1>
<div class="env" id="env">正在检测服务端…</div>
<div class="banner warn" id="warnBanner" style="display:none"></div>
<div class="banner info" id="infoBanner" style="display:none"></div>

<div class="hint">
  按住下面的按钮说话，松开后松手。<br>
  这一版<strong>没有任何游戏规则</strong> —— 只验证四件事：听得准不准、延迟多少、远场能不能听清、一次花多少钱。
</div>

<button class="mic" id="mic">按住说话</button>
<div class="status" id="status">就绪</div>

<div class="card" id="heardCard" style="display:none">
  <div class="k">转写结果</div>
  <div class="v" id="heard"></div>
</div>

<div class="card ai" id="replyCard" style="display:none">
  <div class="k">AI 的回复</div>
  <div class="v" id="reply"></div>
</div>

<div class="card err" id="errCard" style="display:none">
  <div class="k">出错</div>
  <div class="v" id="err"></div>
</div>

<table id="timing" style="display:none">
  <tr><td>录音时长</td><td id="t_rec">—</td></tr>
  <tr><td>ASR</td><td id="t_asr">—</td></tr>
  <tr><td>LLM</td><td id="t_llm">—</td></tr>
  <tr><td>TTS</td><td id="t_tts">—</td></tr>
  <tr><td><strong>总耗时</strong></td><td id="t_total"><strong>—</strong></td></tr>
  <tr><td colspan="2" style="border-bottom:none;padding-top:12px;font-size:12px;color:#6B6B66">
    拾音质量（这一组与 ASR 无关，用来判断「是不是麦克风没收到声音」）</td></tr>
  <tr><td>响度 RMS</td><td id="t_rms">—</td></tr>
  <tr><td>信噪比（估）</td><td id="t_snr">—</td></tr>
  <tr><td>峰值 / 爆音</td><td id="t_peak">—</td></tr>
  <tr><td>有声占比</td><td id="t_voice">—</td></tr>
  <tr><td>判读</td><td id="t_verdict" style="text-align:left;font-size:13px">—</td></tr>
</table>

<div class="card" id="abCard" style="display:none">
  <div class="k">近场 / 远场 对比（每次录音自动记一行）</div>
  <table id="abTbl"></table>
  <div style="font-size:12px;color:#6B6B66">
    同一句话录两遍：先贴到嘴边（约 30cm），再坐到桌子对面（约 1.5m）。<br>
    <b>比的是两次之间的差值</b> —— 模型水平是公共项，差值才是距离造成的。
  </div>
</div>

<div class="rowbtn">
  <button id="replay">重播 AI 语音</button>
  <button id="clear">清空</button>
</div>

<div class="log" id="log"></div>

<script src="/rec.js"></script>
<script>
const $ = id => document.getElementById(id);
const micBtn = $("mic"), statusEl = $("status");

let lastAudioUrl = null;
const ATTEMPTS = [];

function setStatus(s) { statusEl.textContent = s; }

function num(v, unit) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return v + (unit || '');
}

function showInputAudio(a) {
  if (!a || a.error) {
    $('t_verdict').textContent = a && a.error ? a.error : '拿不到指标';
    return;
  }
  $('t_rms').textContent = num(a.rms_dbfs, ' dBFS');
  $('t_snr').textContent = num(a.snr_db, ' dB');
  $('t_peak').textContent = num(a.peak_dbfs, ' dBFS') +
    (a.clipping_pct > 0.1 ? '（爆音 ' + a.clipping_pct + '%）' : '');
  $('t_voice').textContent = num(a.voice_ratio_pct, '%');
  $('t_verdict').textContent = a.verdict || '—';
}

function renderAttempts() {
  if (!ATTEMPTS.length) return;
  $('abCard').style.display = '';
  let h = '<tr><td class="l">#</td><td>时长</td><td>响度</td><td>信噪比</td><td>字数</td></tr>';
  ATTEMPTS.slice(-8).forEach(x => {
    const a = x.a || {};
    const words = x.mocked ? '模拟' : (x.text ? x.text.length : 0);
    h += '<tr><td class="l">' + x.n + '</td><td>' + x.seconds.toFixed(1) + 's</td>'
      + '<td>' + num(a.rms_dbfs, '') + '</td>'
      + '<td>' + num(a.snr_db, '') + '</td>'
      + '<td>' + words + '</td></tr>';
  });
  if (ATTEMPTS.length >= 2) {
    const b = ATTEMPTS[ATTEMPTS.length - 2].a || {};
    const c = ATTEMPTS[ATTEMPTS.length - 1].a || {};
    if (b.rms_dbfs !== undefined && c.rms_dbfs !== undefined) {
      const d = (c.rms_dbfs - b.rms_dbfs);
      h += '<tr><td class="l" colspan="5" style="padding-top:10px;font-size:12px;color:#185FA5">'
        + '最近两次差值：响度 ' + (d >= 0 ? '+' : '') + d.toFixed(1) + ' dB'
        + '（' + (d < -6 ? '远场明显更轻，属正常物理衰减' : '两次接近') + '）'
        + '</td></tr>';
    }
  }
  $('abTbl').innerHTML = h;
}

function log(s) {
  const el = $("log");
  el.innerHTML = s + "<br>" + el.innerHTML;
}

/* 采集、编码、错误分类都在 /rec.js（与对局界面共用同一份实现）。
   分散实现过一次，结果两边漂移，还留下「用 16k 阈值去比 48k 采样数」那个 bug。 */
function micDiagnosis() { return Rec.diagnose(); }

async function startRec() {
  try {
    await Rec.start();
  } catch (e) {
    const msg = Rec.describeError(e);
    setStatus("用不了麦克风");
    $("errCard").style.display = "";
    $("err").textContent = msg;
    log("麦克风失败：" + msg);
    return;
  }
  micBtn.classList.add("on");
  micBtn.textContent = "松手结束";
  setStatus("录音中…");
  log("音频已就绪：采样率 " + Rec.sampleRate() + "Hz，已关闭 AEC/ANS/AGC");
}

async function stopRec() {
  micBtn.classList.remove("on");
  micBtn.textContent = "按住说话";

  const r = await Rec.stop();
  if (!r) return;
  if (r.tooShort) {
    setStatus("太短了（" + r.seconds.toFixed(2) + " 秒），按住多说一会儿再松手");
    return;
  }
  const seconds = r.seconds;

  setStatus("上传中…");
  try {
    const j = await Rec.transcribe(r.blob);
    const roundtrip = j.roundtrip_ms;

    $("errCard").style.display = "none";
    if (j.error) {
      $("errCard").style.display = "";
      $("err").textContent = j.error;
      // 即使失败也把拾音指标显示出来，否则分不清是麦克风问题还是服务端问题
      $("timing").style.display = "";
      $("t_rec").textContent = seconds.toFixed(2) + " 秒";
      showInputAudio(j.input_audio);
      setStatus("服务端返回错误");
      return;
    }

    $("heardCard").style.display = "";
    if (j.asr_mocked) {
      $("heard").innerHTML = '<span style="color:#A32D2D">' + (j.text || '') +
        '</span><br><span style="font-size:12px;color:#A32D2D">' +
        '（这是模拟 ASR 的固定文案，不代表它听懂了你 —— 换到真 ASR 的服务端再看）</span>';
    } else if (!j.text) {
      $("heard").innerHTML = '<span style="color:#A32D2D">（没有转出文字）</span>' +
        '<br><span style="font-size:12px;color:#6B6B66">先看下面的拾音质量：' +
        '响度低于 -55 dBFS 说明麦克风几乎没收到声音，那是形态问题，不是模型问题。</span>';
    } else {
      $("heard").textContent = j.text;
    }
    $("replyCard").style.display = "";
    $("reply").textContent = j.reply;

    $("timing").style.display = "";
    $("t_rec").textContent = seconds.toFixed(2) + " 秒";
    $("t_asr").textContent = j.timings.asr_ms + " ms";
    $("t_llm").textContent = j.timings.llm_ms + " ms";
    $("t_tts").textContent = j.timings.tts_ms + " ms";
    $("t_total").innerHTML = "<strong>" + j.timings.total_ms + " ms</strong>（网络往返 " + roundtrip + " ms）";
    showInputAudio(j.input_audio);

    ATTEMPTS.push({ n: ATTEMPTS.length + 1, seconds: seconds,
                    a: j.input_audio || {}, text: j.text || "",
                    mocked: !!j.asr_mocked });
    renderAttempts();

    playB64(j.audio_b64);
    setStatus("完成");
    log("本次：录音 " + seconds.toFixed(1) + "s｜上行 " + j.in_bytes + " B｜服务端 " + j.timings.total_ms + "ms");
  } catch (e) {
    setStatus("请求失败：" + e.message);
  }
}

function playB64(b64) {
  if (lastAudioUrl) URL.revokeObjectURL(lastAudioUrl);
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const blob = new Blob([arr], { type: "audio/wav" });
  lastAudioUrl = URL.createObjectURL(blob);
  new Audio(lastAudioUrl).play();
}

micBtn.addEventListener("mousedown", startRec);
micBtn.addEventListener("touchstart", e => { e.preventDefault(); startRec(); });
micBtn.addEventListener("mouseup", stopRec);
micBtn.addEventListener("mouseleave", stopRec);
micBtn.addEventListener("touchend", e => { e.preventDefault(); stopRec(); });

$("replay").onclick = () => { if (lastAudioUrl) new Audio(lastAudioUrl).play(); };
$("clear").onclick = () => {
  ["heardCard", "replyCard", "errCard", "timing"].forEach(id => $(id).style.display = "none");
  $("log").innerHTML = "";
  setStatus("就绪");
};

fetch("/api/health").then(r => r.json()).then(j => {
  const L = j.layers || {};
  const asrM = !!(L.asr && L.asr.mocked);
  const llmM = !!(L.llm && L.llm.mocked);
  const ttsM = !!(L.tts && L.tts.mocked);

  $("env").innerHTML = "服务地址 <b>" + location.origin + "</b>｜ASR " + j.asr +
    "｜LLM " + j.llm + "｜TTS " + j.tts;

  if (asrM) {
    $("warnBanner").style.display = "";
    $("warnBanner").innerHTML = "⚠️ <b>这个服务端的 ASR 是模拟的</b>（" + L.asr.impl + "）——"
      + "它会返回同一句固定文案，<b>根本不会识别你说的话</b>。"
      + "所以无论近场还是远场，结果都一模一样，那个结果没有意义。<br>"
      + "多半是打开了<b>另一个端口的服务</b>。要测远场，请确认你打开的是运行了真 ASR 配置的那个地址。";
  } else {
    $("warnBanner").style.display = "none";
  }

  if (!asrM && (llmM || ttsM)) {
    $("infoBanner").style.display = "";
    $("infoBanner").innerHTML = "ASR 是真的（" + L.asr.impl + "）"
      + "，另外两层还是模拟的：" + (llmM ? "LLM " : "") + (ttsM ? "TTS" : "") + "。"
      + "<b>这不影响判断远场</b> —— 远场只跟 ASR 与麦克风有关。";
  } else {
    $("infoBanner").style.display = "none";
  }

  const diag = micDiagnosis();
  if (diag) {
    $("env").innerHTML += '<br><span style="color:#A32D2D">麦克风不可用 —— ' + diag + "</span>";
    micBtn.disabled = true;
    micBtn.textContent = "麦克风不可用";
    setStatus("先解决麦克风访问，见上方红字");
  }
}).catch(() => { $("env").textContent = "无法连接服务端"; });
</script>
</body>
</html>
